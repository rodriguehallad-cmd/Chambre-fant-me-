name: Fabriquer APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
      - name: Créer projet Android
        run: |
          mkdir -p app/src/main/java/com/fantome/app
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/
          echo "include ':app'" > settings.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            compileSdk 33
            defaultConfig { applicationId "com.fantome.app"; minSdk 21; targetSdk 33; versionCode 1; versionName "1.0" }
            buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Chambre Fantome" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/fantome/app/MainActivity.java << 'EOF'
          package com.fantome.app;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebView;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b){ super.onCreate(b); WebView w=new WebView(this); w.getSettings().setJavaScriptEnabled(true); w.loadUrl("file:///android_asset/index.html"); setContentView(w); }
          }
          EOF
      - name: Compiler APK
        run: |
          cd app
          gradle wrapper
          ./gradlew assembleDebug
      - name: Sauvegarder APK
        uses: actions/upload-artifact@v4
        with:
          name: Chambre-Fantome-APK
          path: app/build/outputs/apk/debug/app-debug.apk
